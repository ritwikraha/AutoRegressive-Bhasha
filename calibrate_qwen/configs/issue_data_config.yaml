seed: 42
output_dir: artifacts/issue_base

splits:
  train: 0.80
  validation: 0.10

curation:
  output_dir: artifacts/issue_curated
  min_choices: 2
  max_choices: 6
  min_question_chars: 8
  max_question_chars: 2500
  max_choice_chars: 600
  max_prompt_chars: 8000
  drop_duplicate_choices: true
  drop_duplicate_questions_across_splits: true
  blocked_question_patterns: []
  split_limits:
    train: null
    validation: 1000
    test: null
  source_limits: {}
  balance_sources: false

sources:
  - name: arc_challenge
    dataset: allenai/ai2_arc
    subset: ARC-Challenge
    split: train
    max_examples: null
    enabled: true

  - name: openbookqa
    dataset: allenai/openbookqa
    subset: main
    split: train
    max_examples: null
    enabled: true

  - name: commonsenseqa
    dataset: tau/commonsense_qa
    subset: null
    split: train
    max_examples: null
    enabled: false

  - name: mmlu
    dataset: cais/mmlu
    subset: all
    split: auxiliary_train
    max_examples: 6000
    enabled: true
