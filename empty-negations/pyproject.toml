[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empty-negations"
version = "0.1.0"
description = "Experiments for studying overgeneralized contrastive negation in LLM outputs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jupyter>=1.0.0",
  "json-repair>=0.30.0",
  "matplotlib>=3.8.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0.0",
  "scikit-learn>=1.3.0",
  "seaborn>=0.13.0",
  "statsmodels>=0.14.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "nbformat>=5.9.0"
]
models = [
  "accelerate>=1.10.0",
  "bitsandbytes>=0.46.1",
  "datasets>=2.19.0",
  "huggingface_hub>=0.24.0",
  "peft>=0.12.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.4.0",
  "transformers==5.14.1",
  "trl>=0.10.0",
  "wandb>=0.17.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
